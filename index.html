<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f2"><title>波動研究室</title><meta name="description" content="可調整參數的波動實驗台"><link rel="stylesheet" href="style.css?v=20261108-boat"></head><body><main id="lab"><header><h1>波動研究室</h1><nav aria-label="選擇實驗"><button data-lab="observe">繩波</button><button data-lab="echo">船向岸邊開</button></nav><button id="fullscreen" class="square" aria-label="切換全螢幕" title="全螢幕"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></header>
<section class="stage" aria-label="波動動畫"><div class="canvas-scroll"><canvas id="wave" width="1200" height="480" role="img" aria-label="繩波位置圖"></canvas></div><div id="trace-panel" hidden><div class="canvas-scroll"><canvas id="time" width="1200" height="230" role="img" aria-label="固定觀察點的位移與時間圖"></canvas></div></div><div class="stage-readouts"><output id="measure" aria-live="polite"></output><output id="receipt" aria-live="polite" hidden></output><span id="timer-panel" hidden>模擬時間 <output id="clock">0.00</output> s</span></div></section>
<section class="toolbar" aria-label="播放與量測工具"><div class="transport"><button id="play" class="primary"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 13 8-13 8Z" fill="currentColor"/></svg><span>播放</span></button><button id="step">逐格</button><button id="reset">歸零</button><label class="rate">速度<select id="rate"><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option></select></label></div><div class="toggles"><label><input id="ruler" type="checkbox">尺規</label><label id="timer-toggle"><input id="timer" type="checkbox">計時器</label><label><input id="equilibrium" type="checkbox">參考線</label><label><input id="track" type="checkbox" checked>追蹤點</label><label><input id="trace" type="checkbox">時間圖</label><button id="clear" class="quiet" hidden>清除游標</button></div></section>
<section class="parameters" aria-label="參數調整"><div class="param wave-only"><label for="f">頻率 <output id="f-out"></output></label><input id="f" type="range" min="0.25" max="2" step="0.25" value="0.5"></div><div class="param wave-only"><label for="a">振幅 <output id="a-out"></output></label><input id="a" type="range" min="0.25" max="1.5" step="0.25" value="0.75"></div><div class="param wave-only"><label for="v">繩子設定 <output id="v-out"></output></label><select id="v"><option value="2">甲</option><option value="3">乙</option><option value="4">丙</option></select></div><div class="param wave-only" id="probe-param"><label for="probe">觀察位置 <output id="probe-out"></output></label><input id="probe" type="range" min="0" max="16" step="0.5" value="4"></div><div class="param echo-only" hidden><label for="d">初始離岸距離</label><div class="number-unit"><input id="d-number" type="number" min="100" max="3000" step="50" value="1000" aria-label="初始離岸距離數值"><span>m</span></div><input id="d" type="range" min="100" max="3000" step="50" value="1000" aria-label="初始離岸距離滑桿"></div><div class="param echo-only" hidden><label for="u">船速</label><div class="number-unit"><input id="u-number" type="number" min="0" max="50" step="1" value="20" aria-label="船速數值"><span>m/s</span></div><input id="u" type="range" min="0" max="50" step="1" value="20" aria-label="船速滑桿"></div><div class="echo-only constant" hidden>空氣中聲速 340 m/s</div></section></main><script src="app.js?v=20261108-boat"></script></body></html>
